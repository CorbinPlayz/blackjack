<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0f0d">
<title>Blackjack Chip Tracker</title>
<style>
  :root {
    --bg: #0b0f0d;
    --card: #141b17;
    --card2: #1b251f;
    --line: #26332b;
    --text: #eef3ef;
    --muted: #8a9a90;
    --green: #2ecc71;
    --green-dark: #1e9d54;
    --red: #e5484d;
    --amber: #e0b13a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right))
             max(28px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    max-width: 560px; margin: 0 auto; line-height: 1.3;
  }
  h1 { font-size: 22px; margin: 4px 0 14px; letter-spacing: .3px; }
  h1 span { color: var(--green); }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 14px; }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .row { display: flex; gap: 10px; }
  .row > * { min-width: 0; }
  input[type="text"] {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px 12px; font-size: 16px; /* 16px prevents iOS zoom */
    outline: none; -webkit-appearance: none; appearance: none;
  }
  input[type="text"]:focus { border-color: var(--green); }
  input::placeholder { color: #55645b; }
  button {
    font: inherit; font-weight: 700; border: 0; border-radius: 12px; padding: 14px 12px;
    cursor: pointer; color: #04130a; background: var(--green); min-height: 50px;
    touch-action: manipulation; -webkit-appearance: none; appearance: none;
  }
  button:active { filter: brightness(.85); }
  .btn-add { width: 100%; margin-top: 10px; font-size: 17px; }
  .btn-ghost { background: var(--card2); color: var(--text); border: 1px solid var(--line); }
  .toolbar { display: flex; gap: 10px; margin-bottom: 14px; }
  .toolbar button { flex: 1; font-size: 15px; }
  .msg { min-height: 18px; font-size: 14px; margin-top: 8px; color: var(--red); }
  .msg.ok { color: var(--green); }
  .empty { text-align: center; color: var(--muted); padding: 22px 8px; }

  .online-status { font-size: 14px; color: var(--muted); margin-bottom: 10px; }
  .online-code { font-size: 34px; font-weight: 800; letter-spacing: 6px; color: var(--green); margin: 2px 0 4px; }
  .online-actions { display: flex; gap: 10px; }
  .online-actions button { flex: 1; font-size: 15px; }
  #joinCode { text-transform: uppercase; letter-spacing: 3px; }

  .player { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
  .ptop { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .pname { font-size: 18px; font-weight: 700; word-break: break-word; }
  .pstart { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .remove { background: transparent; color: var(--muted); border: 1px solid var(--line); min-height: 38px; padding: 6px 12px; font-size: 13px; font-weight: 600; flex: none; }
  .balance { font-size: 40px; font-weight: 800; color: var(--green); margin: 8px 0 12px; font-variant-numeric: tabular-nums; word-break: break-all; }
  .balance.zero { color: var(--red); }
  .player.view .balance { margin-bottom: 4px; }
  .wager { margin-bottom: 10px; }
  .wager label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .8px; }
  .outcomes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .outcomes button { min-height: 56px; font-size: 16px; }
  .o-win { background: var(--green); }
  .o-bj { background: var(--amber); }
  .o-push { background: #3a4a41; color: var(--text); }
  .o-loss { background: var(--red); color: #fff; }
  .result { min-height: 18px; margin-top: 10px; font-size: 14px; font-weight: 600; }
  .result.err { color: var(--red); }
  .result.pos { color: var(--green); }
  .result.neg { color: var(--red); }
  .result.neu { color: var(--muted); }

  .hist-row { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .hist-row:first-of-type { border-top: 0; }
  .hist-row .who { min-width: 0; word-break: break-word; }
  .hist-row .what { color: var(--muted); font-size: 13px; }
  .hist-row .amt { font-weight: 700; font-variant-numeric: tabular-nums; flex: none; }
  .amt.pos { color: var(--green); } .amt.neg { color: var(--red); } .amt.neu { color: var(--muted); }
</style>
</head>
<body>

<h1>♠ Blackjack <span>Chip Tracker</span></h1>

<!-- ONLINE TABLE -->
<div class="panel" id="onlinePanel">
  <h2>Online table</h2>
  <div id="onlineOff">
    <div class="online-status">Host from the dealer's phone; everyone else joins with a code and watches live balances.</div>
    <button type="button" class="btn-add" id="hostBtn" style="margin-top:0">Host an online table</button>
    <div class="row" style="margin-top:10px">
      <div style="flex:2"><input type="text" id="joinCode" placeholder="Code" inputmode="text" autocomplete="off" autocapitalize="characters" maxlength="6"></div>
      <div style="flex:1"><button type="button" class="btn-ghost" id="joinBtn" style="width:100%">Join</button></div>
    </div>
  </div>
  <div id="onlineOn" hidden>
    <div class="online-status" id="onlineLabel"></div>
    <div class="online-code" id="onlineCode"></div>
    <div class="online-status" id="onlineState"></div>
    <div class="online-actions"><button type="button" class="btn-ghost" id="leaveBtn">Leave</button></div>
  </div>
  <div class="msg" id="onlineMsg" role="status"></div>
</div>

<!-- ADD PLAYER (no <form>: avoids submission/reload bugs) -->
<div class="panel" id="addPanel">
  <h2>Add player</h2>
  <div class="row">
    <div style="flex:3"><input type="text" id="newName" placeholder="Name" autocomplete="off" autocapitalize="words" maxlength="30"></div>
    <div style="flex:2"><input type="text" id="newStart" placeholder="Chips $" inputmode="decimal" autocomplete="off"></div>
  </div>
  <button type="button" class="btn-add" id="addBtn">Add Player</button>
  <div class="msg" id="addMsg" role="status"></div>
</div>

<div class="toolbar" id="toolbar">
  <button type="button" class="btn-ghost" id="undoBtn">Undo Last Hand</button>
  <button type="button" class="btn-ghost" id="resetBtn">Reset Balances</button>
</div>
<div class="msg" id="toolMsg" role="status" style="margin:-6px 0 10px"></div>

<div id="players"></div>

<div class="panel" id="historyPanel">
  <h2>Recent hands</h2>
  <div id="history"></div>
</div>

<script>
/* ============ CORE LOGIC (no DOM) — amounts are integer cents ============ */
var Core = (function () {
  var STORAGE_KEY = 'bjChipTracker.v1';
  var HISTORY_MAX = 100;
  var state = fresh();
  var readOnly = false;      // viewer mode: never saves, never notifies
  var listeners = [];

  function fresh() { return { players: [], nextId: 1, history: [], nextHid: 1 }; }

  function parseMoney(str) {
    if (typeof str !== 'string') return null;
    var s = str.trim().replace(/^\$/, '').replace(/,/g, '');
    if (!/^(\d+\.?\d{0,2}|\.\d{1,2})$/.test(s)) return null;   // digits only, max 2 decimals
    var cents = Math.round(parseFloat(s) * 100);
    if (!isFinite(cents) || cents > 100000000000) return null;   // sanity cap ($1B)
    return cents;
  }

  function fmt(cents) {
    var neg = cents < 0; if (neg) cents = -cents;
    var dollars = Math.floor(cents / 100), rem = cents % 100;
    var d = String(dollars).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '-' : '') + '$' + d + (rem ? '.' + (rem < 10 ? '0' : '') + rem : '');
  }

  function findPlayer(id) {
    for (var i = 0; i < state.players.length; i++) if (state.players[i].id === id) return state.players[i];
    return null;
  }

  function addPlayer(name, startStr) {
    name = (name || '').trim();
    if (!name) return { ok: false, error: 'Enter a player name.' };
    var cents = parseMoney(startStr);
    if (cents === null) return { ok: false, error: 'Enter a valid starting balance (e.g. 100 or 250.50).' };
    if (cents <= 0) return { ok: false, error: 'Starting balance must be more than $0.' };
    var p = { id: state.nextId++, name: name, start: cents, balance: cents };
    state.players.push(p);
    save();
    return { ok: true, player: p };
  }

  function removePlayer(id) {
    var before = state.players.length;
    state.players = state.players.filter(function (p) { return p.id !== id; });
    save();
    return state.players.length < before;
  }

  function resetAll() {
    state.players.forEach(function (p) { p.balance = p.start; });
    state.history = [];
    save();
  }

  // Each player bets alone against the dealer. Only that player's balance changes.
  function settle(id, wagerStr, outcome) {
    var p = findPlayer(id);
    if (!p) return { ok: false, error: 'Player not found.' };
    var w = parseMoney(wagerStr);
    if (w === null) return { ok: false, error: 'Enter a valid wager (numbers only).' };
    if (w <= 0) return { ok: false, error: 'Wager must be more than $0.' };
    if (w > p.balance) return { ok: false, error: 'Wager is more than balance (' + fmt(p.balance) + ').' };
    var delta;
    if (outcome === 'win') delta = w;                       // 1:1
    else if (outcome === 'blackjack') delta = Math.round(w * 3 / 2); // 3:2
    else if (outcome === 'push') delta = 0;                 // wager returned
    else if (outcome === 'loss') delta = -w;
    else return { ok: false, error: 'Unknown outcome.' };
    p.balance += delta;
    state.history.push({ id: state.nextHid++, pid: p.id, name: p.name, outcome: outcome, wager: w, delta: delta });
    if (state.history.length > HISTORY_MAX) state.history.shift();
    save();
    return { ok: true, delta: delta, balance: p.balance };
  }

  // Reverse the most recent settled hand (only that player's balance is touched).
  function undo() {
    var h = state.history.pop();
    if (!h) return { ok: false, error: 'No hands to undo.' };
    var p = findPlayer(h.pid);
    if (p) p.balance -= h.delta;
    save();
    return { ok: true, entry: h, playerFound: !!p };
  }

  function save() {
    if (readOnly) return;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    listeners.forEach(function (f) { try { f(state); } catch (e) {} });
  }

  function normalize(s) {
    if (!s || !Array.isArray(s.players) || typeof s.nextId !== 'number') return null;
    var out = fresh();
    out.nextId = s.nextId;
    out.players = s.players.filter(function (p) {
      return p && typeof p.id === 'number' && typeof p.name === 'string' &&
             Number.isInteger(p.start) && Number.isInteger(p.balance);
    }).map(function (p) { return { id: p.id, name: p.name, start: p.start, balance: p.balance }; });
    var hist = Array.isArray(s.history) ? s.history : [];
    out.history = hist.filter(function (h) {
      return h && typeof h.id === 'number' && typeof h.pid === 'number' && typeof h.name === 'string' &&
             typeof h.outcome === 'string' && Number.isInteger(h.wager) && Number.isInteger(h.delta);
    }).map(function (h) { return { id: h.id, pid: h.pid, name: h.name, outcome: h.outcome, wager: h.wager, delta: h.delta }; });
    out.nextHid = typeof s.nextHid === 'number' ? s.nextHid : out.history.length + 1;
    return out;
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var n = normalize(JSON.parse(raw));
      if (n) state = n;
    } catch (e) {}
  }

  // Viewer mode: show a remote table without touching this device's own saved table.
  function setReadOnly(on) {
    readOnly = !!on;
    state = fresh();
    if (!readOnly) load();
  }
  function setSnapshot(s) {
    var n = normalize(s);
    if (!n) return false;
    state = n;
    return true;
  }
  function onChange(fn) { listeners.push(fn); }

  return {
    parseMoney: parseMoney, fmt: fmt, addPlayer: addPlayer, removePlayer: removePlayer,
    resetAll: resetAll, settle: settle, undo: undo, load: load,
    setReadOnly: setReadOnly, setSnapshot: setSnapshot, onChange: onChange,
    get state() { return state; }
  };
})();
</script>

<script>
/* ============ UI ============ */
(function () {
  /* Address of the deployed online-table service (see README). Leave '' to keep the app offline-only. */
  var ONLINE_URL = 'https://blackjack-table.camc-cf76.workers.dev';

  var $ = function (id) { return document.getElementById(id); };
  var nameEl = $('newName'), startEl = $('newStart'), addMsg = $('addMsg');
  var listEl = $('players'), historyEl = $('history'), toolMsg = $('toolMsg');
  var wagers = {};   // id -> wager text (kept across re-renders)
  var results = {};  // id -> {text, cls}
  var viewer = false;
  var LABEL = { win: 'Win', blackjack: 'Blackjack', push: 'Push', loss: 'Loss' };

  function setAddMsg(text, ok) { addMsg.textContent = text; addMsg.className = 'msg' + (ok ? ' ok' : ''); }
  function setToolMsg(text) { toolMsg.textContent = text; }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function signed(delta) { return delta > 0 ? '+' + Core.fmt(delta) : Core.fmt(delta); }

  function render() {
    $('addPanel').hidden = viewer;
    $('toolbar').hidden = viewer;
    toolMsg.hidden = viewer;
    renderPlayers();
    renderHistory();
  }

  function renderPlayers() {
    listEl.innerHTML = '';
    var players = Core.state.players;
    if (!players.length) {
      listEl.appendChild(el('div', 'empty', viewer ? 'Waiting for the dealer to add players.' : 'No players yet. Add one above.'));
      return;
    }
    players.forEach(function (p) {
      var card = el('div', 'player' + (viewer ? ' view' : '')); card.setAttribute('data-id', p.id);

      var top = el('div', 'ptop');
      var info = el('div');
      info.appendChild(el('div', 'pname', p.name));
      info.appendChild(el('div', 'pstart', 'Started with ' + Core.fmt(p.start)));
      top.appendChild(info);
      if (!viewer) {
        var rm = el('button', 'remove', 'Remove'); rm.type = 'button'; rm.setAttribute('data-action', 'remove');
        top.appendChild(rm);
      }
      card.appendChild(top);

      card.appendChild(el('div', 'balance' + (p.balance === 0 ? ' zero' : ''), Core.fmt(p.balance)));

      if (!viewer) {
        var wrap = el('div', 'wager');
        var lab = el('label', null, 'Wager'); lab.setAttribute('for', 'w' + p.id);
        var inp = el('input'); inp.type = 'text'; inp.id = 'w' + p.id;
        inp.setAttribute('inputmode', 'decimal'); inp.setAttribute('autocomplete', 'off');
        inp.placeholder = 'Wager $'; inp.setAttribute('data-wager', p.id);
        inp.value = wagers[p.id] || '';
        wrap.appendChild(lab); wrap.appendChild(inp);
        card.appendChild(wrap);

        var grid = el('div', 'outcomes');
        [['win', 'Win 1:1', 'o-win'], ['blackjack', 'Blackjack 3:2', 'o-bj'],
         ['push', 'Push', 'o-push'], ['loss', 'Loss', 'o-loss']].forEach(function (o) {
          var b = el('button', o[2], o[1]); b.type = 'button';
          b.setAttribute('data-action', 'settle'); b.setAttribute('data-outcome', o[0]);
          grid.appendChild(b);
        });
        card.appendChild(grid);

        var r = results[p.id];
        card.appendChild(el('div', 'result' + (r ? ' ' + r.cls : ''), r ? r.text : ''));
      }
      listEl.appendChild(card);
    });
  }

  function renderHistory() {
    historyEl.innerHTML = '';
    var h = Core.state.history;
    if (!h.length) { historyEl.appendChild(el('div', 'empty', 'No hands yet.')); return; }
    for (var i = h.length - 1, shown = 0; i >= 0 && shown < 10; i--, shown++) {
      var e = h[i];
      var row = el('div', 'hist-row');
      var who = el('div', 'who');
      who.appendChild(el('div', null, e.name));
      who.appendChild(el('div', 'what', (LABEL[e.outcome] || e.outcome) + ' · bet ' + Core.fmt(e.wager)));
      row.appendChild(who);
      row.appendChild(el('div', 'amt ' + (e.delta > 0 ? 'pos' : e.delta < 0 ? 'neg' : 'neu'),
        e.delta === 0 ? 'Push' : signed(e.delta)));
      historyEl.appendChild(row);
    }
  }

  /* ---------- host actions ---------- */
  function addPlayer() {
    var res = Core.addPlayer(nameEl.value, startEl.value);
    if (!res.ok) { setAddMsg(res.error, false); return; }
    nameEl.value = ''; startEl.value = '';          // cleared only after success
    setAddMsg('Added ' + res.player.name + ' with ' + Core.fmt(res.player.balance) + '.', true);
    render();
    nameEl.focus();
  }

  $('addBtn').addEventListener('click', function (e) { e.preventDefault(); addPlayer(); });
  [nameEl, startEl].forEach(function (inp) {
    inp.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); addPlayer(); }
    });
  });

  $('resetBtn').addEventListener('click', function (e) {
    e.preventDefault();
    if (viewer || !Core.state.players.length) return;
    if (!window.confirm('Reset every balance to its starting amount? This also clears recent hands.')) return;
    Core.resetAll();
    results = {};
    setToolMsg('');
    render();
  });

  $('undoBtn').addEventListener('click', function (e) {
    e.preventDefault();
    if (viewer) return;
    var res = Core.undo();
    if (!res.ok) { setToolMsg(res.error); return; }
    var en = res.entry;
    delete results[en.pid];
    setToolMsg(res.playerFound ? 'Undid ' + en.name + '’s ' + (LABEL[en.outcome] || en.outcome).toLowerCase() + ' (' + signed(en.delta) + ').'
                               : 'Removed the last hand (' + en.name + ' is no longer at the table).');
    render();
  });

  listEl.addEventListener('input', function (e) {
    var id = e.target.getAttribute && e.target.getAttribute('data-wager');
    if (id) wagers[id] = e.target.value;
  });

  listEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.getAttribute && e.target.getAttribute('data-wager')) e.preventDefault();
  });

  listEl.addEventListener('click', function (e) {
    if (viewer) return;
    var btn = e.target.closest ? e.target.closest('button[data-action]') : null;
    if (!btn) return;
    e.preventDefault();
    var card = btn.closest('.player');
    var id = parseInt(card.getAttribute('data-id'), 10);
    var action = btn.getAttribute('data-action');

    if (action === 'remove') {
      var p = null;
      Core.state.players.forEach(function (x) { if (x.id === id) p = x; });
      if (!p || !window.confirm('Remove ' + p.name + '?')) return;
      Core.removePlayer(id);
      delete wagers[id]; delete results[id];
      render();
      return;
    }

    if (action === 'settle') {
      var outcome = btn.getAttribute('data-outcome');
      var wagerText = card.querySelector('input[data-wager]').value;
      wagers[id] = wagerText;
      var res = Core.settle(id, wagerText, outcome);
      setToolMsg('');
      if (!res.ok) {
        results[id] = { text: res.error, cls: 'err' };
      } else {
        var label = LABEL[outcome];
        var txt = res.delta > 0 ? label + ': +' + Core.fmt(res.delta)
                : res.delta < 0 ? label + ': ' + Core.fmt(res.delta)
                : label + ': balance unchanged';
        results[id] = { text: txt, cls: res.delta > 0 ? 'pos' : res.delta < 0 ? 'neg' : 'neu' };
      }
      render();
    }
  });

  /* ============ ONLINE TABLE ============
     Host (dealer) phone is the source of truth and pushes the table after every change.
     Joiners poll read-only. If ONLINE_URL is '' none of this runs and the app stays offline. */
  var ONLINE_KEY = 'bjOnline.v1';
  var online = { role: null, code: null, token: null };   // role: 'host' | 'viewer' | null
  var pollTimer = null, lastV = -1, pushing = false, dirty = false, polling = false;

  function saveOnline() {
    try {
      if (online.role) localStorage.setItem(ONLINE_KEY, JSON.stringify(online));
      else localStorage.removeItem(ONLINE_KEY);
    } catch (e) {}
  }
  function setOnlineMsg(text, ok) { $('onlineMsg').textContent = text; $('onlineMsg').className = 'msg' + (ok ? ' ok' : ''); }
  function setOnlineState(text) { $('onlineState').textContent = text; }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function renderOnlinePanel() {
    var on = !!online.role;
    $('onlineOff').hidden = on;
    $('onlineOn').hidden = !on;
    if (on) {
      $('onlineLabel').textContent = online.role === 'host' ? 'You are hosting. Share this code:' : 'Watching table:';
      $('onlineCode').textContent = online.code;
      $('leaveBtn').textContent = online.role === 'host' ? 'Stop hosting' : 'Leave table';
    }
  }

  function clearOnline(msg) {
    var wasViewer = online.role === 'viewer';
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    online = { role: null, code: null, token: null };
    dirty = false; lastV = -1;
    saveOnline();
    if (wasViewer) { viewer = false; Core.setReadOnly(false); wagers = {}; results = {}; }
    renderOnlinePanel();
    setOnlineMsg(msg || '', false);
    render();
  }

  function needUrl() {
    if (ONLINE_URL) return false;
    setOnlineMsg('Online play is not set up on this copy yet (see README).', false);
    return true;
  }

  /* --- host --- */
  async function hostTable() {
    if (needUrl()) return;
    setOnlineMsg('Creating table…', true);
    try {
      var r = await fetch(ONLINE_URL + '/api/rooms', { method: 'POST' });
      if (!r.ok) throw new Error('status ' + r.status);
      var d = await r.json();
      online = { role: 'host', code: d.code, token: d.token };
      saveOnline();
      renderOnlinePanel();
      setOnlineMsg('', true);
      schedulePush();
    } catch (e) {
      setOnlineMsg('Could not create the table. Check your connection and try again.', false);
    }
  }

  function schedulePush() {
    if (online.role !== 'host') return;
    dirty = true;
    if (!pushing) pushLoop();
  }

  async function pushLoop() {
    pushing = true;
    while (dirty && online.role === 'host') {
      dirty = false;
      try {
        var r = await fetch(ONLINE_URL + '/api/rooms/' + online.code, {
          method: 'PUT',
          headers: { 'Authorization': 'Bearer ' + online.token, 'Content-Type': 'application/json' },
          body: JSON.stringify({ state: Core.state })
        });
        if (r.status === 401 || r.status === 404) { pushing = false; clearOnline('That table expired. Host a new one.'); return; }
        if (!r.ok) throw new Error('status ' + r.status);
        setOnlineState('Live · players can see updates');
      } catch (e) {
        dirty = true;
        setOnlineState('Reconnecting… (the table still works here)');
        await sleep(3000);
      }
    }
    pushing = false;
  }
  Core.onChange(function () { schedulePush(); });

  /* --- viewer --- */
  async function pollOnce() {
    if (polling || online.role !== 'viewer') return;
    polling = true;
    try {
      var r = await fetch(ONLINE_URL + '/api/rooms/' + online.code, { cache: 'no-store' });
      if (r.status === 404) { polling = false; clearOnline('That table has closed.'); return; }
      if (!r.ok) throw new Error('status ' + r.status);
      var d = await r.json();
      if (d.v !== lastV && Core.setSnapshot(d.state)) { lastV = d.v; render(); }
      setOnlineState('Live');
    } catch (e) {
      setOnlineState('Reconnecting…');
    }
    polling = false;
  }

  function startViewing() {
    viewer = true;
    Core.setReadOnly(true);
    lastV = -1;
    renderOnlinePanel();
    render();
    pollOnce();
    pollTimer = setInterval(pollOnce, 2500);
  }

  async function joinTable() {
    if (needUrl()) return;
    var code = $('joinCode').value.trim().toUpperCase();
    if (!/^[A-Z0-9]{4,6}$/.test(code)) { setOnlineMsg('Enter the table code from the dealer.', false); return; }
    setOnlineMsg('Joining…', true);
    try {
      var r = await fetch(ONLINE_URL + '/api/rooms/' + code, { cache: 'no-store' });
      if (r.status === 404) { setOnlineMsg('No table with that code.', false); return; }
      if (!r.ok) throw new Error('status ' + r.status);
      online = { role: 'viewer', code: code, token: null };
      saveOnline();
      $('joinCode').value = '';
      setOnlineMsg('', true);
      startViewing();
    } catch (e) {
      setOnlineMsg('Could not reach the table. Check your connection.', false);
    }
  }

  $('hostBtn').addEventListener('click', function (e) { e.preventDefault(); hostTable(); });
  $('joinBtn').addEventListener('click', function (e) { e.preventDefault(); joinTable(); });
  $('joinCode').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); joinTable(); } });
  $('leaveBtn').addEventListener('click', function (e) {
    e.preventDefault();
    if (online.role === 'host' && !window.confirm('Stop hosting? Players will stop seeing updates.')) return;
    clearOnline('');
  });

  /* ---------- start up ---------- */
  Core.load();
  try {
    var saved = JSON.parse(localStorage.getItem(ONLINE_KEY) || 'null');
    if (ONLINE_URL && saved && (saved.role === 'host' || saved.role === 'viewer') && typeof saved.code === 'string') online = saved;
  } catch (e) {}
  renderOnlinePanel();
  if (online.role === 'viewer') startViewing();
  else { render(); if (online.role === 'host') schedulePush(); }
})();
</script>
</body>
</html>
